<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c5cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sina AI">
  <meta name="description" content="دستیار هوش مصنوعی شما">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <title>Sina AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <img class="brand-icon" src="https://cdn.hermesagents.net/public/images/hermes-avatar.png" alt="Hermes">
          <span class="brand-text">AI</span>
        </div>
        <button id="newChatBtn" class="btn-new-chat" title="چت جدید">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
        <button id="searchCloseBtn" class="search-close hidden" onclick="clearSearch()">✕</button>
      </div>

      <!-- Search Results -->
      <div id="searchResults" class="search-results hidden"></div>

      <!-- Session List -->
      <div id="sessionList" class="session-list">
        <div class="loading-state">Loading...</div>
      </div>

      <div class="sidebar-footer">
        <button id="memoryBtn" class="btn-sidebar-footer" onclick="openMemory()" title="Memory">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10H12V2z"/>
            <path d="M20.66 8A10 10 0 0 0 14 2.05V8h6.66z"/>
          </svg>
          <span>Memory</span>
        </button>
        <button id="healthBtn" class="btn-sidebar-footer" onclick="openStatus()" title="Status">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
          <span>Status</span>
        </button>
        <button id="settingsBtn" class="btn-sidebar-footer" onclick="openSettings()" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button class="modal-close" onclick="closeSettings()">&times;</button>
        </div>
        <div class="modal-body" id="settingsBody">
          <div class="loading-state">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Memory Modal -->
    <div id="memoryModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Memory</h2>
          <button class="modal-close" onclick="closeMemory()">&times;</button>
        </div>
        <div class="modal-body" id="memoryBody">
          <div class="loading-state">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Status Modal -->
    <div id="statusModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Status</h2>
          <button class="modal-close" onclick="closeStatus()">&times;</button>
        </div>
        <div class="modal-body" id="statusBody">
          <div class="loading-state">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <main id="mainContent" class="main-content">
      <!-- Top bar -->
      <div class="topbar">
        <button id="menuToggle" class="btn-menu" title="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="topbar-title" id="topbarTitle">Hermes AI</div>
      </div>

      <!-- Welcome screen -->
      <div id="welcomeScreen" class="welcome-screen">
        <div class="welcome-logo">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
            <path d="M8 12h8M12 8v8"/>
          </svg>
        </div>
        <h1>AI</h1>
        <p class="welcome-subtitle">چطور می‌تونم کمکت کنم؟</p>
      </div>

      <!-- Messages area -->
      <div id="messagesContainer" class="messages-container hidden">
        <div id="messagesList" class="messages-list"></div>
        <div id="typingIndicator" class="typing-indicator hidden">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span>در حال تایپ...</span>
        </div>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <div id="attachmentPreview" class="attachment-preview hidden"></div>
        <div class="input-wrapper">
          <!-- Hidden file inputs for each type -->
          <input type="file" id="fileInputImage" multiple class="hidden" accept="image/*">
          <input type="file" id="fileInputDoc" multiple class="hidden" accept=".pdf,.doc,.docx,.txt,.md,.csv,.xml,.json,.yaml,.yml,.log,.env,.toml,.cfg,.ini,.rtf">
          <input type="file" id="fileInputCode" multiple class="hidden" accept=".py,.js,.ts,.jsx,.tsx,.html,.css,.scss,.sh,.bash,.sql,.go,.rs,.java,.c,.cpp,.h,.rb,.php,.swift,.kt">
          <input type="file" id="fileInputAny" multiple class="hidden">
          <!-- Upload menu -->
          <div class="upload-menu-wrap">
            <button id="uploadBtn" class="btn-upload" aria-label="پیوست" title="پیوست فایل">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
            <div id="uploadMenu" class="upload-menu hidden">
              <button onclick="triggerUpload('fileInputImage')">
                <span>🖼️</span> ارسال عکس
              </button>
              <button onclick="triggerUpload('fileInputDoc')">
                <span>📄</span> ارسال داکیومنت
              </button>
              <button onclick="triggerUpload('fileInputCode')">
                <span>💻</span> ارسال کد
              </button>
              <button onclick="triggerUpload('fileInputAny')">
                <span>📎</span> ارسال فایل
              </button>
            </div>
          </div>
          <textarea id="messageInput" placeholder="پیامتو بنویس..." rows="1" autofocus></textarea>
          <button id="sendBtn" class="btn-send" disabled aria-label="ارسال">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"/>
            </svg>
          </button>
        </div>
        <div class="input-footer">
          <span> هوش مصنوعی ممکنه اشتباه کنه. اطلاعات مهم رو بررسی کن.</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
